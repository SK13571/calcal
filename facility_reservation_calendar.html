<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시설 예약 캘린더 (Facility Booking)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .scrollbar-thin::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    .day-cell {
      min-height: 110px;
    }
    @media (max-width: 640px) {
      .day-cell {
        min-height: 75px;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      
      <!-- Logo & Month Navigation -->
      <div class="flex items-center justify-between sm:justify-start gap-4">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-indigo-100 shadow-lg">
            <i data-lucide="building-2" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold text-slate-900 leading-tight">스마트 공간 예약</h1>
            <p class="text-xs text-slate-500 font-medium">Facility Booking System</p>
          </div>
        </div>

        <!-- Month Navigation -->
        <div class="flex items-center bg-slate-100 rounded-lg p-1">
          <button id="btn-prev-month" class="p-1.5 hover:bg-white rounded-md text-slate-600 hover:text-slate-900 transition shadow-xs" title="이전 달">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <button id="btn-today" class="px-2.5 py-1 text-xs font-semibold hover:bg-white rounded-md text-slate-700 transition shadow-xs">
            오늘
          </button>
          <button id="btn-next-month" class="p-1.5 hover:bg-white rounded-md text-slate-600 hover:text-slate-900 transition shadow-xs" title="다음 달">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

        <span id="current-month-label" class="text-base sm:text-lg font-bold text-slate-800 whitespace-nowrap min-w-[130px]"></span>
      </div>

      <!-- Facility Filter & New Reservation Button -->
      <div class="flex items-center gap-2.5 justify-between sm:justify-end flex-wrap">
        <div class="flex items-center gap-1.5 text-xs text-slate-600">
          <i data-lucide="filter" class="w-3.5 h-3.5 text-slate-400"></i>
          <select id="facility-filter" class="bg-slate-100 border-none rounded-lg px-2.5 py-2 text-xs font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
            <option value="ALL">전체 시설 보기</option>
          </select>
        </div>

        <button id="btn-open-booking-modal" class="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold shadow-sm transition active:scale-95">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>새 예약 등록</span>
        </button>
      </div>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1 flex flex-col">
    <!-- Facility Legends -->
    <div id="facility-legend-container" class="flex flex-wrap items-center gap-2 mb-4 text-xs font-medium"></div>

    <!-- Calendar Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col flex-1">
      <!-- Weekday Header -->
      <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50/80 text-center text-xs font-semibold text-slate-500 py-2.5">
        <span class="text-rose-500">일</span>
        <span>월</span>
        <span>화</span>
        <span>수</span>
        <span>목</span>
        <span>금</span>
        <span class="text-blue-500">토</span>
      </div>

      <!-- Calendar Days Grid -->
      <div id="calendar-grid" class="grid grid-cols-7 flex-1 divide-x divide-y divide-slate-100 bg-slate-100">
        <!-- Rendered via JavaScript -->
      </div>
    </div>
  </main>

  <div id="booking-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
            <i data-lucide="calendar-plus" class="w-4 h-4"></i>
          </div>
          <h3 class="text-base font-bold text-slate-900">새 시설 예약</h3>
        </div>
        <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 p-1 rounded-md transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Form Body -->
      <form id="booking-form" class="p-6 space-y-4">
        <!-- Facility Select -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">예약 시설 <span class="text-rose-500">*</span></label>
          <select id="modal-facility" required class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <!-- Populated dynamically -->
          </select>
        </div>

        <!-- Date Picker -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">예약 일자 <span class="text-rose-500">*</span></label>
          <input type="date" id="modal-date" required class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- Time Picker (Start & End) -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">시작 시간 <span class="text-rose-500">*</span></label>
            <input type="time" id="modal-start-time" required step="1800" class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">종료 시간 <span class="text-rose-500">*</span></label>
            <input type="time" id="modal-end-time" required step="1800" class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <!-- Reserver Info -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">예약자 이름 <span class="text-rose-500">*</span></label>
            <input type="text" id="modal-reserver" placeholder="홍길동" required class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">소속 부서/팀</label>
            <input type="text" id="modal-department" placeholder="기획팀" class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <!-- Purpose -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">사용 목적 <span class="text-rose-500">*</span></label>
          <input type="text" id="modal-purpose" placeholder="주간 팀 스프린트 회의" required class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- Alert Banner in Modal for validation error -->
        <div id="modal-error-banner" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-lg text-xs flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
          <span id="modal-error-text">오류가 발생했습니다.</span>
        </div>

        <!-- Submit & Cancel Buttons -->
        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" id="btn-cancel-modal" class="px-4 py-2 border border-slate-200 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
            취소
          </button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-xs transition">
            예약 확정
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="day-drawer-backdrop" class="fixed inset-0 z-40 bg-slate-900/30 backdrop-blur-xs hidden transition-opacity">
    <div id="day-drawer" class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
      
      <!-- Drawer Header -->
      <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <div>
          <div class="flex items-center gap-2">
            <h2 id="drawer-date-title" class="text-lg font-bold text-slate-900">2026년 9월 28일</h2>
            <span id="drawer-booking-count" class="px-2 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700">0건</span>
          </div>
          <p class="text-xs text-slate-500 mt-0.5">선택한 일자의 전체 예약 일정표</p>
        </div>
        <button id="btn-close-drawer" class="p-1.5 text-slate-400 hover:text-slate-700 rounded-lg transition hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Quick Add on this Day -->
      <div class="px-5 py-3 bg-indigo-50/60 border-b border-indigo-100 flex items-center justify-between">
        <span class="text-xs font-semibold text-indigo-900">이 날짜에 바로 예약하기</span>
        <button id="btn-drawer-quick-add" class="inline-flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded-md shadow-xs transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          추가
        </button>
      </div>

      <!-- Timeline Schedule List -->
      <div id="drawer-timeline" class="flex-1 overflow-y-auto p-5 space-y-3.5 scrollbar-thin">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    // Standard facility definitions with Tailwind badges & color palettes
    const FACILITIES = [
      { id: 'FAC_1', name: '대회의실 A (본관 3F)', color: 'blue', bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', tag: 'bg-blue-500' },
      { id: 'FAC_2', name: '세미나실 B (본관 2F)', color: 'emerald', bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', tag: 'bg-emerald-500' },
      { id: 'FAC_3', name: '미디어 스튜디오 C (별관 1F)', color: 'purple', bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', tag: 'bg-purple-500' },
      { id: 'FAC_4', name: '다목적 라운지 (별관 2F)', color: 'amber', bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', tag: 'bg-amber-500' },
    ];

    // Seed dummy data if empty
    const STORAGE_KEY = 'facility_calendar_reservations_v1';
    
    let currentDate = new Date();
    let selectedDateStr = null;
    let selectedFacilityFilter = 'ALL';
    let reservations = [];

    // Helper: format YYYY-MM-DD
    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function loadInitialReservations() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          reservations = JSON.parse(stored);
          return;
        } catch (e) {
          console.error('Failed to parse localStorage data', e);
        }
      }

      // Default sample bookings
      const today = new Date();
      const tKey = formatDateKey(today);
      
      const tomorrow = new Date(today);
      tomorrow.setDate(today.getDate() + 1);
      const tmKey = formatDateKey(tomorrow);

      const nextWeek = new Date(today);
      nextWeek.setDate(today.getDate() + 4);
      const nwKey = formatDateKey(nextWeek);

      reservations = [
        {
          id: 'res_' + Date.now() + '_1',
          facilityId: 'FAC_1',
          date: tKey,
          startTime: '10:00',
          endTime: '11:30',
          reserver: '김철수',
          department: '전략기획팀',
          purpose: '2026 하반기 전략 회의',
          createdAt: new Date().toISOString()
        },
        {
          id: 'res_' + Date.now() + '_2',
          facilityId: 'FAC_2',
          date: tKey,
          startTime: '14:00',
          endTime: '15:30',
          reserver: '이영희',
          department: '프로덕트팀',
          purpose: 'UI/UX 디자인 스프린트 리뷰',
          createdAt: new Date().toISOString()
        },
        {
          id: 'res_' + Date.now() + '_3',
          facilityId: 'FAC_3',
          date: tmKey,
          startTime: '13:00',
          endTime: '15:00',
          reserver: '박지민',
          department: '마케팅팀',
          purpose: '신규 서비스 홍보 영상 촬영',
          createdAt: new Date().toISOString()
        },
        {
          id: 'res_' + Date.now() + '_4',
          facilityId: 'FAC_4',
          date: nwKey,
          startTime: '16:00',
          endTime: '18:00',
          reserver: '최민호',
          department: 'HR팀',
          purpose: '신규 입사자 온보딩 웰컴 밋업',
          createdAt: new Date().toISOString()
        }
      ];
      saveReservations();
    }

    function saveReservations() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(reservations));
    }

    function initFacilityUI() {
      const filterSelect = document.getElementById('facility-filter');
      const modalSelect = document.getElementById('modal-facility');
      const legendContainer = document.getElementById('facility-legend-container');

      FACILITIES.forEach(fac => {
        // Filter options
        const optFilter = document.createElement('option');
        optFilter.value = fac.id;
        optFilter.textContent = fac.name;
        filterSelect.appendChild(optFilter);

        // Modal options
        const optModal = document.createElement('option');
        optModal.value = fac.id;
        optModal.textContent = fac.name;
        modalSelect.appendChild(optModal);

        // Legend tags
        const tag = document.createElement('div');
        tag.className = `flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${fac.bg} ${fac.text} border ${fac.border}`;
        tag.innerHTML = `<span class="w-2 h-2 rounded-full ${fac.tag}"></span>${fac.name}`;
        legendContainer.appendChild(tag);
      });
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Update Header label
      document.getElementById('current-month-label').textContent = `${year}년 ${month + 1}월`;

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
      const totalDaysInPrevMonth = new Date(year, month, 0).getDate();

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const todayStr = formatDateKey(new Date());

      // 1. Previous month trailing days
      for (let i = firstDayOfMonth - 1; i >= 0; i--) {
        const dayNum = totalDaysInPrevMonth - i;
        const cell = createDayCell(new Date(year, month - 1, dayNum), true);
        grid.appendChild(cell);
      }

      // 2. Current month days
      for (let d = 1; d <= totalDaysInMonth; d++) {
        const dayDate = new Date(year, month, d);
        const cell = createDayCell(dayDate, false);
        grid.appendChild(cell);
      }

      // 3. Next month leading days to fill full 35 or 42 grid cells
      const totalCellsRendered = firstDayOfMonth + totalDaysInMonth;
      const remainingCells = (totalCellsRendered % 7 === 0) ? 0 : 7 - (totalCellsRendered % 7);
      for (let n = 1; n <= remainingCells; n++) {
        const cell = createDayCell(new Date(year, month + 1, n), true);
        grid.appendChild(cell);
      }

      lucide.createIcons();
    }

    function createDayCell(dateObj, isOtherMonth) {
      const dateKey = formatDateKey(dateObj);
      const isToday = (dateKey === formatDateKey(new Date()));
      const dayOfWeek = dateObj.getDay();

      const cell = document.createElement('div');
      cell.className = `day-cell p-1.5 sm:p-2 bg-white flex flex-col justify-between transition hover:bg-indigo-50/30 cursor-pointer ${
        isOtherMonth ? 'opacity-40 bg-slate-50/60' : ''
      }`;
      cell.setAttribute('data-date', dateKey);

      // Header row inside day
      const header = document.createElement('div');
      header.className = 'flex items-center justify-between mb-1';

      const dayNumber = document.createElement('span');
      let textCol = 'text-slate-700';
      if (dayOfWeek === 0) textCol = 'text-rose-500';
      if (dayOfWeek === 6) textCol = 'text-blue-500';

      dayNumber.className = `text-xs sm:text-sm font-semibold rounded-full w-6 h-6 flex items-center justify-center ${textCol} ${
        isToday ? '!bg-indigo-600 !text-white shadow-xs font-bold' : ''
      }`;
      dayNumber.textContent = dateObj.getDate();
      header.appendChild(dayNumber);

      // Filtered reservations for this day
      const dayBookings = reservations.filter(r => {
        const matchesDate = r.date === dateKey;
        const matchesFac = (selectedFacilityFilter === 'ALL' || r.facilityId === selectedFacilityFilter);
        return matchesDate && matchesFac;
      }).sort((a, b) => a.startTime.localeCompare(b.startTime));

      if (dayBookings.length > 0) {
        const countBadge = document.createElement('span');
        countBadge.className = 'text-[10px] px-1.5 py-0.2 rounded-full font-bold bg-slate-100 text-slate-600 sm:inline hidden';
        countBadge.textContent = `${dayBookings.length}건`;
        header.appendChild(countBadge);
      }
      cell.appendChild(header);

      // Events container
      const eventsList = document.createElement('div');
      eventsList.className = 'flex-1 space-y-1 overflow-hidden';

      const maxVisible = 2;
      dayBookings.slice(0, maxVisible).forEach(b => {
        const fac = FACILITIES.find(f => f.id === b.facilityId) || FACILITIES[0];
        const item = document.createElement('div');
        item.className = `text-[10px] sm:text-xs truncate px-1.5 py-0.5 rounded font-medium ${fac.bg} ${fac.text} border ${fac.border} flex items-center gap-1 shadow-2xs`;
        item.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${fac.tag} shrink-0"></span><span class="font-semibold">${b.startTime}</span> <span class="truncate">${fac.name.split(' ')[0]}</span>`;
        eventsList.appendChild(item);
      });

      if (dayBookings.length > maxVisible) {
        const moreTag = document.createElement('div');
        moreTag.className = 'text-[10px] text-slate-500 font-semibold pl-1';
        moreTag.textContent = `+${dayBookings.length - maxVisible}개 더보기`;
        eventsList.appendChild(moreTag);
      }

      cell.appendChild(eventsList);

      // Click to open Drawer
      cell.addEventListener('click', () => {
        openDayDrawer(dateKey);
      });

      return cell;
    }

    function openDayDrawer(dateKey) {
      selectedDateStr = dateKey;
      const [y, m, d] = dateKey.split('-');
      document.getElementById('drawer-date-title').textContent = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;

      const dayBookings = reservations.filter(r => r.date === dateKey)
        .sort((a, b) => a.startTime.localeCompare(b.startTime));

      document.getElementById('drawer-booking-count').textContent = `${dayBookings.length}건`;

      const timeline = document.getElementById('drawer-timeline');
      timeline.innerHTML = '';

      if (dayBookings.length === 0) {
        timeline.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-slate-400 text-center p-4">
            <i data-lucide="calendar-x-2" class="w-12 h-12 stroke-[1.5] mb-2 text-slate-300"></i>
            <p class="text-sm font-semibold text-slate-600">등록된 예약 일정이 없습니다.</p>
            <p class="text-xs text-slate-400 mt-1">상단의 '추가' 버튼을 눌러 새 예약을 등록해 보세요.</p>
          </div>
        `;
      } else {
        dayBookings.forEach(b => {
          const fac = FACILITIES.find(f => f.id === b.facilityId) || FACILITIES[0];
          
          const card = document.createElement('div');
          card.className = `p-4 rounded-xl border ${fac.border} ${fac.bg} shadow-2xs relative group transition hover:shadow-xs`;

          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div>
                <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-bold ${fac.text} bg-white/80 border ${fac.border} mb-1.5">
                  <span class="w-1.5 h-1.5 rounded-full ${fac.tag}"></span>
                  ${fac.name}
                </span>
                <h4 class="text-sm font-bold text-slate-900 leading-snug">${b.purpose}</h4>
              </div>
              <button data-delete-id="${b.id}" class="text-slate-400 hover:text-rose-600 p-1 rounded-md transition hover:bg-white" title="예약 취소">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="mt-3 pt-3 border-t ${fac.border} flex flex-wrap items-center justify-between text-xs text-slate-600 gap-2">
              <div class="flex items-center gap-1 font-semibold text-slate-700">
                <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i>
                <span>${b.startTime} ~ ${b.endTime}</span>
              </div>
              <div class="flex items-center gap-1">
                <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                <span class="font-medium">${b.reserver}</span>
                ${b.department ? `<span class="text-slate-400">(${b.department})</span>` : ''}
              </div>
            </div>
          `;

          // Handle cancel/delete
          card.querySelector('[data-delete-id]').addEventListener('click', (e) => {
            e.stopPropagation();
            cancelBooking(b.id);
          });

          timeline.appendChild(card);
        });
      }

      // Show drawer
      const backdrop = document.getElementById('day-drawer-backdrop');
      const drawer = document.getElementById('day-drawer');
      backdrop.classList.remove('hidden');
      setTimeout(() => {
        drawer.classList.remove('translate-x-full');
      }, 10);

      lucide.createIcons();
    }

    function closeDayDrawer() {
      const backdrop = document.getElementById('day-drawer-backdrop');
      const drawer = document.getElementById('day-drawer');
      drawer.classList.add('translate-x-full');
      setTimeout(() => {
        backdrop.classList.add('hidden');
      }, 250);
    }

    function cancelBooking(id) {
      reservations = reservations.filter(r => r.id !== id);
      saveReservations();
      showToast('예약이 취소되었습니다.', 'info');
      renderCalendar();
      if (selectedDateStr) {
        openDayDrawer(selectedDateStr);
      }
    }

    function openBookingModal(defaultDate = null) {
      const modal = document.getElementById('booking-modal');
      const errorBanner = document.getElementById('modal-error-banner');
      errorBanner.classList.add('hidden');

      const dateInput = document.getElementById('modal-date');
      const targetDate = defaultDate || selectedDateStr || formatDateKey(new Date());
      dateInput.value = targetDate;

      // Default reasonable business hours
      document.getElementById('modal-start-time').value = '10:00';
      document.getElementById('modal-end-time').value = '11:00';

      modal.classList.remove('hidden');
    }

    function closeBookingModal() {
      const modal = document.getElementById('booking-modal');
      modal.classList.add('hidden');
      document.getElementById('booking-form').reset();
    }

    function checkTimeOverlap(facilityId, date, startTime, endTime) {
      return reservations.some(res => {
        if (res.facilityId !== facilityId || res.date !== date) return false;
        
        // Check time collision: (StartA < EndB) and (EndA > StartB)
        return (startTime < res.endTime && endTime > res.startTime);
      });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const isError = type === 'error';
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-xs sm:text-sm font-semibold transition-all duration-300 transform translate-y-3 opacity-0 ${
        isError 
          ? 'bg-rose-50 border-rose-200 text-rose-700' 
          : 'bg-slate-900 border-slate-800 text-white'
      }`;

      toast.innerHTML = `
        <i data-lucide="${isError ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i>
        <span>${message}</span>
      `;

      container.appendChild(toast);
      lucide.createIcons();

      // Trigger animation
      setTimeout(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadInitialReservations();
      initFacilityUI();
      renderCalendar();

      // Month navigations
      document.getElementById('btn-prev-month').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
      });
      document.getElementById('btn-next-month').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
      });
      document.getElementById('btn-today').addEventListener('click', () => {
        currentDate = new Date();
        renderCalendar();
      });

      // Filter change
      document.getElementById('facility-filter').addEventListener('change', (e) => {
        selectedFacilityFilter = e.target.value;
        renderCalendar();
      });

      // Modal open/close
      document.getElementById('btn-open-booking-modal').addEventListener('click', () => openBookingModal());
      document.getElementById('btn-close-modal').addEventListener('click', closeBookingModal);
      document.getElementById('btn-cancel-modal').addEventListener('click', closeBookingModal);

      // Drawer interactions
      document.getElementById('btn-close-drawer').addEventListener('click', closeDayDrawer);
      document.getElementById('day-drawer-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'day-drawer-backdrop') closeDayDrawer();
      });
      document.getElementById('btn-drawer-quick-add').addEventListener('click', () => {
        openBookingModal(selectedDateStr);
      });

      // Form submission with validation
      document.getElementById('booking-form').addEventListener('submit', (e) => {
        e.preventDefault();

        const facilityId = document.getElementById('modal-facility').value;
        const date = document.getElementById('modal-date').value;
        const startTime = document.getElementById('modal-start-time').value;
        const endTime = document.getElementById('modal-end-time').value;
        const reserver = document.getElementById('modal-reserver').value.trim();
        const department = document.getElementById('modal-department').value.trim();
        const purpose = document.getElementById('modal-purpose').value.trim();

        const errorBanner = document.getElementById('modal-error-banner');
        const errorText = document.getElementById('modal-error-text');

        // Validation 1: Start < End
        if (startTime >= endTime) {
          errorText.textContent = '종료 시간은 시작 시간보다 이후여야 합니다.';
          errorBanner.classList.remove('hidden');
          return;
        }

        // Validation 2: Duplicate check
        const isOverlapping = checkTimeOverlap(facilityId, date, startTime, endTime);
        if (isOverlapping) {
          const facName = FACILITIES.find(f => f.id === facilityId)?.name || '선택 시설';
          errorText.textContent = `해당 시간대에 '${facName}'에 이미 등록된 예약이 존재합니다.`;
          errorBanner.classList.remove('hidden');
          return;
        }

        // Create new booking
        const newBooking = {
          id: 'res_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          facilityId,
          date,
          startTime,
          endTime,
          reserver,
          department,
          purpose,
          createdAt: new Date().toISOString()
        };

        reservations.push(newBooking);
        saveReservations();

        closeBookingModal();
        renderCalendar();
        showToast('성공적으로 예약이 확정되었습니다.');

        // Refresh drawer if open on the same date
        if (selectedDateStr === date) {
          openDayDrawer(date);
        }
      });

      lucide.createIcons();
    });
  </script>
</body>
</html>
